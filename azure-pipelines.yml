# Elmah.Core - Azure Pipelines CI/CD
# Triggers on push to main/master, and on v* tags for NuGet release

trigger:
  branches:
    include:
      - main
      - master
  tags:
    include:
      - 'v*'

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:

# Install .NET 8 SDK (required for library build targets net8.0 and unit tests)
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: sdk
    version: '8.x'

# Install .NET 10 SDK (required for Demos/ElmahCore.DemoCore10)
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: sdk
    version: '10.x'

# Restore all NuGet packages
- task: DotNetCoreCLI@2
  displayName: 'Restore packages'
  inputs:
    command: restore
    projects: 'ElmahCore.sln'

# Build entire solution
- task: DotNetCoreCLI@2
  displayName: 'Build solution'
  inputs:
    command: build
    projects: 'ElmahCore.sln'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# Run unit tests
- task: DotNetCoreCLI@2
  displayName: 'Run unit tests'
  inputs:
    command: test
    projects: 'Tests/**/*.csproj'
    arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage"'

# Pack NuGet packages (only library projects, not demos/tests)
- task: DotNetCoreCLI@2
  displayName: 'Pack NuGet packages'
  inputs:
    command: pack
    packagesToPack: |
      ElmahCore/ElmahCore.csproj
      ElmahCore.Mvc/ElmahCore.Mvc.csproj
      ElmahCore.MsSql/ElmahCore.Sql.csproj
      ElmahCore.MySql/ElmahCore.MySql.csproj
      ElmahCore.Postgresql/ElmahCore.Postgresql.csproj
    packDirectory: '$(Build.ArtifactStagingDirectory)/nupkg'
    configuration: '$(buildConfiguration)'
    nobuild: true
    versioningScheme: 'off'

# Publish NuGet packages to NuGet.org on tagged releases only
- task: NuGetCommand@2
  displayName: 'Push to NuGet.org'
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
  inputs:
    command: push
    packagesToPush: '$(Build.ArtifactStagingDirectory)/nupkg/*.nupkg'
    nuGetFeedType: external
    publishFeedCredentials: 'NuGet.org'

# Always publish nupkg as pipeline artifact (for download/debugging)
- task: PublishBuildArtifacts@1
  displayName: 'Publish nupkg artifacts'
  condition: always()
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/nupkg'
    ArtifactName: 'nupkg'
    publishLocation: 'Container'